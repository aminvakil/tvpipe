<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tvpipe playshare</title>
<link rel="stylesheet" href="launcher.css">
<script type="module" src="launcher.js"></script>
</head>
<body>
<main>
  <header>
    <p class="kicker">tvpipe playshare</p>
    <h1 id="title">Loading…</h1>
    <p id="players" class="muted"></p>
  </header>
  <section>
    <h2>Where should the game show?</h2>
    <p class="muted">Pick one or more TVs. They are found on your network as they answer.</p>
    <ul id="devices" class="devices"></ul>
    <p id="searching" class="muted searching">Looking for TVs…</p>
  </section>
  <section class="status">
    <p id="phones" class="muted"></p>
    <p id="error" class="error" hidden></p>
  </section>
  <footer>
    <button id="start" class="primary" disabled>Start</button>
    <button id="no-tv" class="link">Start without a TV</button>
  </footer>
</main>
<dialog id="pin">
  <form method="dialog" id="pin-form">
    <h2>Pair with <span id="pin-device"></span></h2>
    <p class="muted" id="pin-text">The TV shows a code. Type it here.</p>
    <input id="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]*" placeholder="1234">
    <p class="error" id="pin-error" hidden></p>
    <div class="row">
      <button type="button" id="pin-cancel" class="link">Cancel</button>
      <button type="submit" id="pin-ok" class="primary">Pair</button>
    </div>
  </form>
</dialog>
</body>
</html>
