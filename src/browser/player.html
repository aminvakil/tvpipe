<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tvpipe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f5f5f7; }
  body.idle, body.idle * { cursor: none !important; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #message { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #a1a1a6; max-width: 80%; }
  #message b { display: block; color: #f5f5f7; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  #sound { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; background: rgba(40,40,44,.85); color: #fff; }
  button:hover { background: rgba(70,70,76,.95); }
  #sound { background: #0a66d8; }
  #controls { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; transition: opacity .3s; }
  body.idle #controls { opacity: 0; pointer-events: none; }
  #stats { position: absolute; left: 10px; top: 10px; margin: 0; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.7); color: #e0e0e0; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="video" width="2" height="2"></canvas>
<div id="message"><b>tvpipe</b><span id="detail">Connecting…</span></div>
<button id="sound" hidden>Click for sound</button>
<div id="controls">
  <button id="statsButton" title="Statistics (S)">Stats</button>
  <button id="fullscreen" title="Fullscreen (F, double-click)">Fullscreen</button>
</div>
<pre id="stats" hidden><span id="statsText"></span>
now     <span id="clock">–</span></pre>
<script src="/player.js"></script>
</body>
</html>
