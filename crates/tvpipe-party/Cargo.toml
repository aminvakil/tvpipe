[package]
name = "tvpipe-party"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Party games on tvpipe: phones join with a QR code, the host keeps rooms, players and views in sync over WebSockets"
license = "Apache-2.0"
readme = "README.md"
keywords = ["party-game", "websocket", "airplay", "chromecast", "gamedev"]
categories = ["game-development", "network-programming"]
include = ["/Cargo.toml", "/README.md", "/src/", "/web/", "/tests/", "/examples/"]

[features]
default = ["tunnel"]
# Public links for phones (Cloudflare quick tunnels, OpenTunnel).
tunnel = ["tvpipe/tunnel"]
# Game-defined message types with the `deser` crate (docs/multiscreen-design.md §10.1;
# needs Rust 1.88, deser's minimum).
deser = ["dep:deser", "deser/derive", "dep:deser-json"]
# The WebRTC fast path: data channels to phones on the LAN, beside the
# WebSocket (docs/multiscreen-design.md §2.4; the sans-IO `rtc` crate on
# ring, driven from threads; needs Rust 1.89, rtc's minimum).
webrtc = ["dep:rtc"]

[dependencies]
# The exact version: tvpipe-party uses tvpipe's hidden `__web` module
# (docs/multiscreen-design.md §1.1).
tvpipe = { path = "../tvpipe", version = "=0.2.0", default-features = false, features = ["player"] }
ring = "0.17"
deser = { version = "0.10", optional = true, default-features = false, features = ["std"] }
deser-json = { version = "0.10", optional = true, default-features = false, features = ["std"] }
rtc = { version = "0.21", optional = true, default-features = false, features = ["crypto-ring"] }

[dev-dependencies]
# The examples and doc tests stop on Ctrl-C.
tvpipe = { path = "../tvpipe", version = "=0.2.0", default-features = false, features = ["player", "signals"] }

[[example]]
name = "buzzer"
# Its test checks the embedded page list against the directory.
test = true

[[example]]
name = "stick"
test = true
