<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Stick</title>
<style>
  html, body { margin: 0; height: 100%; font: 18px system-ui, sans-serif; background: #111; color: #eee; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; box-sizing: border-box; text-align: center; }
  [hidden] { display: none !important; }
  input, button { font: inherit; padding: .6rem 1rem; border-radius: .5rem; border: 0; }
  #pad { width: 70vmin; height: 70vmin; border-radius: 50%; background: #333; position: relative; touch-action: none; }
  #knob { width: 22%; height: 22%; border-radius: 50%; background: #4fc3f7; position: absolute; left: 39%; top: 39%; }
  #status { min-height: 1.5em; color: #aaa; }
</style>
</head>
<body>
<form id="join">
  <p><input id="name" maxlength="20" placeholder="Your name" autocomplete="nickname" required></p>
  <p><button>Join</button></p>
</form>
<main id="game" hidden>
  <div id="pad"><div id="knob"></div></div>
  <p id="status"></p>
</main>
<script type="module" src="stick.js"></script>
</body>
</html>
