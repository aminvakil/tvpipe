<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Buzzer</title>
<style>
  html, body { margin: 0; height: 100%; font: 18px system-ui, sans-serif; background: #111; color: #eee; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; box-sizing: border-box; text-align: center; }
  [hidden] { display: none !important; }
  input, button { font: inherit; padding: .6rem 1rem; border-radius: .5rem; border: 0; }
  #buzz { width: 70vmin; height: 70vmin; border-radius: 50%; font-size: 2rem; font-weight: 700; background: #444; color: #fff; touch-action: manipulation; }
  #buzz.go { background: #e53935; }
  #status { min-height: 1.5em; }
  #players { list-style: none; padding: 0; margin: 0; color: #aaa; }
</style>
</head>
<body>
<form id="join">
  <p><input id="name" maxlength="20" placeholder="Your name" autocomplete="nickname" required></p>
  <p><button>Join</button></p>
</form>
<main id="game" hidden>
  <p id="status"></p>
  <button id="buzz" disabled>BUZZ</button>
  <p><button id="start" hidden>Start a round</button></p>
  <ul id="players"></ul>
</main>
<script type="module" src="buzzer.js"></script>
</body>
</html>
