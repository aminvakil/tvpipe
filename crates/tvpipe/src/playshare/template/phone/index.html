<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="phone.css">
<script type="module" src="phone.js"></script>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <form id="join" hidden>
    <input id="name" maxlength="16" placeholder="Your name" autocomplete="nickname" required>
    <button>Join</button>
  </form>
  <section id="game" hidden>
    <p id="hello"></p>
    <button id="buzz" disabled>Buzz!</button>
    <p id="result"></p>
  </section>
  <p id="status" class="muted"></p>
</main>
</body>
</html>
