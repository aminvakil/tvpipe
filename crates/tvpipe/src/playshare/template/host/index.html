<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="host.css">
<script type="module" src="host.js"></script>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p id="error" hidden></p>
  <div class="columns">
    <section>
      <p>Phones join at <a id="link" target="_blank"></a></p>
      <div class="qr" id="qr"></div>
      <p id="tv" class="muted">TV: not cast</p>
    </section>
    <section>
      <h2>Round <span id="round">0</span></h2>
      <ol id="players"></ol>
      <p><button id="next">New round</button> <button id="cast">Cast again</button> <button id="quit">End</button></p>
    </section>
    <section>
      <h2>The TV</h2>
      <div class="preview"><iframe id="preview" title="TV preview"></iframe></div>
    </section>
  </div>
</main>
</body>
</html>
