name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of running for hours (a run takes
    # a few minutes).
    timeout-minutes: 20
    steps:
      # .gitattributes keeps text files LF on Windows (autocrlf is on there).
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The ffmpeg oracle tests skip without ffmpeg; run them on one OS
      # (Ubuntu 24.04 ships ffmpeg 6.1 with libx264 and libopus).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Without the LGPL FairPlay crate (the library's default later on).
      - if: runner.os == 'Linux'
        run: cargo clippy -p tvpipe --all-targets --no-default-features -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test -p tvpipe --no-default-features

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets

  # The Node SDK (npm/tvpipe) against the debug binary.
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo build
      - name: The SDK's version is the crate's
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          sdk_version="$(node -p 'require("./npm/tvpipe/package.json").version')"
          test "$cargo_version" = "$sdk_version" || { echo "npm/tvpipe/package.json has $sdk_version, Cargo.toml $cargo_version" >&2; exit 1; }
      - working-directory: npm/tvpipe
        run: |
          npm ci
          npm run build
          npm run check
      - working-directory: npm/tvpipe
        env:
          TVPIPE_BINARY: ${{ github.workspace }}/target/debug/tvpipe${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npm test
