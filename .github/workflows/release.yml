name: Release

# Pushing a tag vX.Y.Z builds the release archives and publishes a GitHub
# Release with them, then the npm packages (`@tvpipe/sdk` and the six
# `@tvpipe/<os>-<cpu>` binary packages, see docs/sdk-design.md). Running the
# workflow by hand (workflow_dispatch) is a dry run: it builds and packages
# everything and keeps the archives, the checksums, the release notes and
# the npm tarballs as workflow artifacts, but publishes nothing.
#
# npm publishing uses trusted publishing (OIDC): no token; each package on
# npmjs.com trusts this repository's release.yml. So does crates.io for the
# five crates (tvpipe-fairplay, tvpipe, tvpipe-cli, tvpipe-canvas,
# tvpipe-party), which the `crates` job publishes in that order
# (tvpipe-party pins tvpipe exactly, so they always go out together).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
          # Static musl binaries run on any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run: true
          # Cross-compiled on x86_64; ring needs clang for this target
          # (preinstalled on the Windows runners).
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            run: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          # Cargo.toml keeps line tables in release builds; macOS and
          # Windows binaries carry none anyway (dSYM/PDB), so leave them
          # out of the Linux ones too (a third of the size).
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          case "${{ matrix.target }}" in
            *-linux-musl)
              cc_var="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
              export "$cc_var=musl-gcc"
              ;;
            *-windows-msvc)
              # No dependency on the Visual C++ runtime DLLs.
              export RUSTFLAGS="-C target-feature=+crt-static"
              ;;
          esac
          cargo build --release --locked -p tvpipe-cli --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          name="tvpipe-$version-${{ matrix.target }}"
          exe=tvpipe
          case "${{ matrix.target }}" in *-windows-*) exe=tvpipe.exe ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp -R LICENSE LICENSES README.md "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *-windows-*) 7z a -tzip -bd "$name.zip" "$name" >/dev/null; archive="$name.zip" ;;
            *) tar -czf "$name.tar.gz" "$name"; archive="$name.tar.gz" ;;
          esac
          ls -l "$archive" "$name/$exe"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Inspect
        run: |
          f="target/${{ matrix.target }}/release/tvpipe"
          case "${{ matrix.target }}" in *-windows-*) f="$f.exe" ;; esac
          file "$f" | tee file.txt
          case "${{ matrix.target }}" in
            *-linux-musl) grep -q 'static-pie linked\|statically linked' file.txt ;;
          esac
      - name: Smoke test
        if: matrix.run
        run: |
          out="$(dist/tvpipe-*/tvpipe* --version)"
          echo "$out"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          case "$out" in *"$version"*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Checksums and notes
        run: |
          cd dist
          ls -l
          test "$(ls | wc -l)" -eq 6
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          sed "s/{{version}}/${{ steps.version.outputs.version }}/g" \
            ../.github/release-notes.md > ../release-notes.md
          cat ../release-notes.md
      - name: Keep the dry run's output
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/
            release-notes.md
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "tvpipe ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --generate-notes

  npm:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1 && npm --version
      - name: Check the versions
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          for pkg in tvpipe party; do
            v="$(node -p "require('./npm/$pkg/package.json').version")"
            test "$v" = "$version" || { echo "npm/$pkg/package.json has $v, Cargo.toml $version" >&2; exit 1; }
          done
      - name: Build the SDK
        working-directory: npm/tvpipe
        run: |
          npm ci
          npm run build
          npm run check
      - name: Test the SDK against the release binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf dist/tvpipe-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP/bin" --strip-components=1
          cd npm/tvpipe
          TVPIPE_BINARY="$RUNNER_TEMP/bin/tvpipe" npm test
      - name: Stage the packages
        run: |
          node npm/scripts/build-packages.mjs --artifacts dist --out npm-dist
          mkdir npm-tarballs
          for dir in $(node -p 'require("./npm-dist/packages.json").map((p) => p.dir).join(" ")'); do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-tarballs")
          done
          ls -l npm-tarballs
      - name: Dry run
        if: github.ref_type != 'tag'
        run: node npm/scripts/publish-packages.mjs --out npm-dist --dry-run
      - name: Keep the dry run's tarballs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: npm-dry-run
          path: npm-tarballs/
      - name: Publish
        if: github.ref_type == 'tag'
        run: node npm/scripts/publish-packages.mjs --out npm-dist --provenance

  # The Rust crates (docs/rust-sdk-design.md §8), in dependency order. A
  # version that is on crates.io already is skipped, so a rerun completes.
  crates:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io trusted publishing (OIDC): no token secret.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Dry run
        if: github.ref_type != 'tag'
        run: cargo publish --dry-run --workspace --locked
      - uses: rust-lang/crates-io-auth-action@v1
        if: github.ref_type == 'tag'
        id: auth
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for crate in tvpipe-fairplay tvpipe tvpipe-cli tvpipe-canvas tvpipe-party; do
            if curl -sf -A "tvpipe release workflow (github.com/mitsuhiko/tvpipe)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is on crates.io already"
              continue
            fi
            # Waits until the index has it, so the next crate resolves it.
            cargo publish -p "$crate" --locked
          done
