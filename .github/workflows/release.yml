name: Release

# Pushing a tag vX.Y.Z builds the release archives and publishes a GitHub
# Release with them. Running the workflow by hand (workflow_dispatch) is a
# dry run: it builds and packages everything and keeps the archives, the
# checksums and the release notes as workflow artifacts, but publishes
# nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
          # Static musl binaries run on any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            run: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            run: true
          # Cross-compiled on x86_64; ring needs clang for this target
          # (preinstalled on the Windows runners).
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            run: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          # Cargo.toml keeps line tables in release builds; macOS and
          # Windows binaries carry none anyway (dSYM/PDB), so leave them
          # out of the Linux ones too (a third of the size).
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: |
          case "${{ matrix.target }}" in
            *-linux-musl)
              cc_var="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
              export "$cc_var=musl-gcc"
              ;;
            *-windows-msvc)
              # No dependency on the Visual C++ runtime DLLs.
              export RUSTFLAGS="-C target-feature=+crt-static"
              ;;
          esac
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          name="tvpipe-$version-${{ matrix.target }}"
          exe=tvpipe
          case "${{ matrix.target }}" in *-windows-*) exe=tvpipe.exe ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp -R LICENSE LICENSES README.md "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *-windows-*) 7z a -tzip -bd "$name.zip" "$name" >/dev/null; archive="$name.zip" ;;
            *) tar -czf "$name.tar.gz" "$name"; archive="$name.tar.gz" ;;
          esac
          ls -l "$archive" "$name/$exe"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Inspect
        run: |
          f="target/${{ matrix.target }}/release/tvpipe"
          case "${{ matrix.target }}" in *-windows-*) f="$f.exe" ;; esac
          file "$f" | tee file.txt
          case "${{ matrix.target }}" in
            *-linux-musl) grep -q 'static-pie linked\|statically linked' file.txt ;;
          esac
      - name: Smoke test
        if: matrix.run
        run: |
          out="$(dist/tvpipe-*/tvpipe* --version)"
          echo "$out"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          case "$out" in *"$version"*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Checksums and notes
        run: |
          cd dist
          ls -l
          test "$(ls | wc -l)" -eq 6
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          sed "s/{{version}}/${{ steps.version.outputs.version }}/g" \
            ../.github/release-notes.md > ../release-notes.md
          cat ../release-notes.md
      - name: Keep the dry run's output
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/
            release-notes.md
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "tvpipe ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --generate-notes
