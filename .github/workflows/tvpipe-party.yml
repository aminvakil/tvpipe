name: tvpipe.party

# Tests and deploys apps/tvpipe-party: the Cloudflare Worker behind
# tvpipe.party (short join links, docs/short-links.md) together with the
# website it serves (site/_out). Needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "apps/tvpipe-party/**"
      - "site/**"
      - "crates/tvpipe/src/browser/fonts/**"
      - ".github/workflows/tvpipe-party.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling.
concurrency:
  group: tvpipe-party
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tvpipe-party
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build the website
        run: python3 ../../site/build.py
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply tvpipe-party --remote && npx wrangler deploy
