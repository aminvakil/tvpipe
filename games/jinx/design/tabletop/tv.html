<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinx — tabletop TV mockup</title>
<link rel="stylesheet" href="tv.css">
<script src="tv.js" defer></script>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="table"></div>
    <div id="fx"></div>
    <div id="safe" hidden></div>
  </div>
</div>
<div id="controls">
  <div class="row" id="phases"></div>
  <div class="row" id="actions"></div>
  <div class="row hint">←/→ phase · 1–9, 0 jump · Space replay phase · S sound · G safe area · H hide this bar · ?wrong=1 or W for the wrong-guess path</div>
</div>
</body>
</html>
