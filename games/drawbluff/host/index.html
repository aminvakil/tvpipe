<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drawbluff</title>
<link rel="stylesheet" href="host.css">
<script type="module" src="host.js"></script>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <span class="logo">drawbluff</span>
      <span id="phase" class="muted"></span>
    </header>
    <section class="join">
      <div id="qr" class="qr"></div>
      <div>
        <p class="muted">Room</p>
        <p id="code" class="code">····</p>
        <p class="muted">Phones join at</p>
        <p id="link" class="link"></p>
        <p id="link-note" class="muted small"></p>
      </div>
    </section>
    <section>
      <h2>On the TV</h2>
      <ul id="tvs" class="tvs"><li class="muted">No TV: open the preview on a screen yourself.</li></ul>
      <div class="row">
        <button id="cast-again" hidden>Try again</button>
        <a id="player" href="#" target="_blank" hidden>Open the TV view</a>
      </div>
    </section>
    <section>
      <h2>Players <span id="count" class="muted"></span></h2>
      <ul id="players" class="players"></ul>
      <div class="row">
        <button id="bot1">Add a bot</button>
        <button id="bot3">Add 3 bots</button>
      </div>
    </section>
    <section class="settings">
      <label>Rounds <select id="rounds"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label>Timers <select id="timers"><option value="normal">normal</option><option value="fast">fast</option></select></label>
      <label>Latecomers <select id="late"><option value="wait">next round</option><option value="open">anytime</option><option value="closed">not during a game</option></select></label>
    </section>
    <footer>
      <button id="start" class="primary">Start the game</button>
      <button id="quit" class="quiet">End</button>
    </footer>
    <p id="error" class="error" hidden></p>
  </aside>
  <main>
    <div class="preview"><iframe id="preview" title="What the TV shows"></iframe></div>
    <p class="muted small">What the TV shows (a preview, no sound). The VIP's phone can start the game too.</p>
  </main>
</div>
</body>
</html>
