<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beam · tvpipe</title>
<!-- tvpipe's look: tokens, fonts and parts, served by tvpipe game play (docs/games.md). -->
<link rel="stylesheet" href="/_tvpipe/ui.css">
<style>
  .ph { padding-top: 44px; }
  .controls { display: grid; gap: 16px; margin-top: 34px; }
  .controls label { display: grid; gap: 6px; }
  .row > .meta .controls .lbl { margin: 0; }
  select { width: 100%; font: 14px var(--sans); color: var(--ink); background: var(--panel); border: 0; border-radius: 3px; padding: 7px 8px; }
  .lead { margin-bottom: 22px; }
  canvas { display: block; max-width: 520px; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 3px; margin-bottom: 12px; }
  .ph .buttons { margin: 0 0 26px; }
  details pre { margin: 18px 0 0; padding: 14px 16px; background: var(--panel); border-radius: 4px; color: var(--ink-2);
                font: 400 12.5px/1.65 var(--mono); white-space: pre-wrap; overflow: auto; }
  pre:empty { display: none; }
</style>
<script type="module" src="host.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 560 520">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g style="stroke:var(--logo-ink)" stroke-width="12"><line x1="208" y1="118" x2="152" y2="62"/><line x1="256" y1="118" x2="322" y2="40"/></g>
      <g style="fill:var(--logo-ink)"><circle cx="152" cy="62" r="14"/><circle cx="322" cy="40" r="14"/><path d="M180 137 A52 30 0 0 1 284 137 Z"/><path d="M92 474 A19 19 0 0 0 130 474 Z"/><path d="M334 474 A19 19 0 0 0 372 474 Z"/></g>
      <rect x="23" y="137" width="419" height="331" rx="48" style="stroke:var(--logo-ink);fill:var(--logo-screen)" stroke-width="16"/>
      <path d="M92 180 Q211 168 330 180 Q350 182 352 202 Q360 301 352 400 Q350 420 330 422 Q211 434 92 422 Q72 420 70 400 Q62 301 70 202 Q72 182 92 180 Z" style="stroke:var(--logo-ink)" stroke-width="14"/>
      <circle cx="390" cy="222" r="17" fill="#E8743B"/><circle cx="390" cy="272" r="12" fill="#E8743B"/>
      <g stroke-width="14">
        <path d="M190 268 C265 268 325 300 393 360 L390 322 A55 13 0 0 0 500 322 C506 370 500 420 455 437 C420 446 390 440 360 412 C300 350 250 304 190 304 Z" style="stroke:var(--logo-screen)" stroke-width="40"/>
        <path d="M190 268 C265 268 325 300 393 360 L390 322 A55 13 0 0 0 500 322 C506 370 500 420 455 437 C420 446 390 440 360 412 C300 350 250 304 190 304 Z" fill="#E8743B" style="stroke:var(--logo-ink)"/>
        <ellipse cx="445" cy="322" rx="55" ry="13" style="fill:var(--logo-screen);stroke:var(--logo-ink)"/>
        <line x1="182" y1="262" x2="182" y2="310" style="stroke:var(--logo-ink)" stroke-width="16"/>
      </g>
      <g stroke="#E8743B" stroke-width="13" transform="translate(12 0)"><path d="M492 225 C492 205 464 195 464 160 C464 136 482 120 502 120 C522 120 536 135 533 155 C531 170 518 177 507 175"/><path d="M470 290 C468 262 492 252 506 242 C520 230 524 214 518 200"/></g>
    </g>
  </symbol>
</svg>

<header class="top">
  <div class="mark"><svg viewBox="0 0 560 520" aria-hidden="true"><use href="#logo"/></svg><span>tv<b>pipe</b></span></div>
  <div class="pair">Game<span>beam</span></div>
  <div class="pair">TVs<span id="tvs">–</span></div>
</header>
<main>
  <section class="row ph">
    <div class="meta">
      <span class="lbl">Status</span><span class="state" id="state">Connecting…</span>
      <div class="controls">
        <label><span class="lbl">Path</span><select id="path"><option value="canvas">canvas (surface)</option><option value="tab">tab capture</option></select></label>
        <label><span class="lbl">Clock</span><select id="clock"><option value="raf">animation frames</option><option value="timer">timer</option><option value="worker">worker (OffscreenCanvas)</option></select></label>
        <label><span class="lbl">Size</span><select id="size"><option>1280x720</option><option>1920x1080</option></select></label>
        <label><span class="lbl">Frames/s</span><select id="fps"><option>30</option><option>60</option></select></label>
        <label><span class="lbl">Sound</span><select id="audio"><option value="1">a beep a second</option><option value="0">none</option></select></label>
        <label><span class="lbl">Second screen</span><select id="second"><option value="">none</option><option value="same">to the same TVs</option></select></label>
      </div>
    </div>
    <div class="body">
      <h1>Canvases on TVs</h1>
      <p class="lead">A WebGL picture on the TVs: encoded in this page (a surface) or this picture as a page tvpipe captures (the tab).</p>
      <div class="buttons">
        <button id="start" class="btn primary">Start</button>
        <button id="stop" class="btn" disabled>Stop</button>
      </div>
      <canvas id="c" width="1280" height="720"></canvas>
      <canvas id="c2" width="1280" height="720" hidden></canvas>
    </div>
  </section>
  <section class="row sec">
    <div class="meta"></div>
    <details class="body">
      <summary><span class="lbl">Details</span></summary>
      <pre id="status"></pre>
      <pre id="stats"></pre>
    </details>
  </section>
</main>
</body>
</html>
