[package]
name = "streamlib"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Low-latency mirroring of video and audio to AirPlay and Google Cast receivers"
license = "Apache-2.0"
publish = false

[dependencies]
argument = "0.1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
debug = 1
